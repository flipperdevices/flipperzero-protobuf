syntax = "proto3";

package PB_Network;
option java_package = "com.flipperdevices.protobuf.network";

enum Protocol {
    TCP = 0;
    UDP = 1;
}

enum ConnectionState {
    DISCONNECTED = 0;
    CONNECTING = 1;
    CONNECTED = 2;
    ERROR = 3;
}

enum ErrorCode {
    NONE = 0;
    DNS_FAILED = 1;
    TIMEOUT = 2;
    CONNECTION_REFUSED = 3;
    NETWORK_UNREACHABLE = 4;
    HOST_UNREACHABLE = 5;
    INVALID_CONNECTION = 6;
    NOT_CONNECTED = 7;
    SEND_FAILED = 8;
    RECEIVE_FAILED = 9;
    MAX_CONNECTIONS = 10;
    INVALID_PROTOCOL = 11;
    INTERNAL_ERROR = 12;
}

message ConnectRequest {
    string host = 1;
    uint32 port = 2;
    Protocol protocol = 3;
    uint32 timeout_ms = 4;
    uint32 connection_id = 5;  // Client-assigned connection ID
}

message ConnectResponse {
    uint32 connection_id = 1;
    ConnectionState state = 2;
    ErrorCode error = 3;
    string resolved_ip = 4;
}

message SendRequest {
    uint32 connection_id = 1;
    bytes data = 2;
}

message SendResponse {
    uint32 connection_id = 1;
    uint32 bytes_sent = 2;
    ErrorCode error = 3;
}

message ReceiveData {
    uint32 connection_id = 1;
    bytes data = 2;
}

message CloseRequest {
    uint32 connection_id = 1;
}

message CloseResponse {
    uint32 connection_id = 1;
    ErrorCode error = 2;
}

message StateChanged {
    uint32 connection_id = 1;
    ConnectionState state = 2;
    ErrorCode error = 3;
}
